# SafeRouter — conda environment. Everything except PandaGuard (note at bottom).
#
#   conda env create -f environment.yml && conda activate saferouter
#   bash scripts/train.sh
#
# torch is resolved by pip together with vllm, which pins it tightly -- so do not
# swap torch alone afterwards either.
#
# Then verify the GPU. A wheel built for a newer CUDA than your driver installs
# cleanly and only fails at runtime:
#   python -c "import torch; print(torch.cuda.is_available())"
# If False, re-pin the pair together:
#   pip install torch==2.10.0 torchvision==0.25.0 torchaudio==2.10.0 vllm==0.19.1
# Paper used torch 2.11.0+cu130 on B200 / L4; any >=2.4 build reproduces it.
#
# vllm's linux marker: skipped on macOS / Windows, route models via the API there.

name: saferouter
channels:
  - conda-forge
dependencies:
  - python=3.10                     # tested 3.10.19; >=3.10 required
  - pip
  - pip:
      # train + evaluate from the shipped data
      - torch>=2.4                  # tested 2.11.0
      - numpy>=1.24,<3              # tested 2.2.6
      - scipy>=1.10                 # tested 1.15.3   Clopper-Pearson bound in select_tau()
      - scikit-learn>=1.3           # tested 1.7.2    CARROT k-NN baseline
      - joblib>=1.3                 # tested 1.5.3    baseline checkpoint I/O
      # re-embed / rebuild the SCR pool
      - transformers>=4.40          # tested 5.8.1    Qwen3-Embedding-0.6B encoder
      - sentence-transformers>=3.0  # tested 5.4.1    SCR pool encoder
      - pandas>=2.0                 # tested 2.3.3    WildJailbreak TSV loading
      - tqdm>=4.65                  # tested 4.67.3
      # collect probes + judge (needs OPENROUTER_API_KEY / OPENAI_API_KEY)
      - openai>=1.40                # tested 2.24.0   OpenAI-compatible client (also OpenRouter)
      - httpx>=0.27                 # tested 0.28.1
      - nltk>=3.8                   # tested 3.10.3   BLEU for S6 / PARDEN
      # local model serving (scripts/start_local.sh, quality_judge.py)
      - vllm>=0.6; sys_platform == "linux"   # tested 0.21.0

# PandaGuard (attacks/*.py) is not installable from here: it is read by path as
# PANDA_GUARD_ROOT = <SafeRouter>/../panda-guard, so it needs a sibling source
# clone. scripts/install.sh does it; by hand, after activating the env:
#   git clone https://github.com/Beijing-AISI/panda-guard.git ../panda-guard
#   pip install -e ../panda-guard
